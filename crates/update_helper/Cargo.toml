[package]
name = "sleipnir-update-helper"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
updater.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace", "block2", "libc"] }
objc2-foundation = { version = "0.3", features = ["NSError", "NSString", "NSURL"] }

[dev-dependencies]
tempfile.workspace = true
