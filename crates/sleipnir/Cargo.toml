[package]
name = "sleipnir"
version = "0.6.9"
edition.workspace = true
publish = false
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "sleipnir"
path = "src/main.rs"

[features]
# The browser panel's user-facing entries; forwards to `sleipnir_ui`.
browser-panel = ["sleipnir_ui/browser-panel"]

[dependencies]
env_logger.workspace = true
gpui = { workspace = true, features = ["font-kit"] }
gpui_platform = { workspace = true, features = ["font-kit"] }
sleipnir_settings.workspace = true
sleipnir_ui.workspace = true
release_channel.workspace = true
terminal.workspace = true
updater.workspace = true
log.workspace = true
sleipnir_browser_control.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[dev-dependencies]
plugin_protocol.workspace = true
serde_json.workspace = true
tempfile.workspace = true
uuid.workspace = true
