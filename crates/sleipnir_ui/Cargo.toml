[package]
name = "sleipnir_ui"
version = "0.1.1"
edition.workspace = true
publish = false
license.workspace = true

[lints]
workspace = true

[dependencies]
collections.workspace = true
dirs.workspace = true
gpui.workspace = true
terminal.workspace = true
sleipnir_settings.workspace = true
release_channel.workspace = true
updater.workspace = true
itertools.workspace = true
log.workspace = true
util.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
run_ledger.workspace = true
diff_core.workspace = true
syntax.workspace = true
sleipnir_ctl.workspace = true
sleipnir_browser_control.workspace = true
plugin_host.workspace = true
plugin_grants.workspace = true
plugin_protocol.workspace = true
sleipnir_widget.workspace = true
row_geometry.workspace = true
sysinfo.workspace = true
async-channel.workspace = true
futures.workspace = true
regex.workspace = true
percent-encoding.workspace = true
url.workspace = true
unicode-segmentation = "1.12"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = { version = "=0.55.1", default-features = false }
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc2 = "0.6"

[dev-dependencies]
tempfile.workspace = true
