[package]
name = "gpui_platform"
version = "0.1.1"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_platform.rs"

[features]
default = []
# macOS always enables font-kit on the target dep below. Kept so older
# feature flags still resolve.
font-kit = []

[dependencies]
gpui.workspace = true
gpui_macos = { workspace = true, features = ["font-kit"] }
