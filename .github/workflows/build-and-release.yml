name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0)'
        required: true
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  APP_NAME: Sleipnir
  RUST_TOOLCHAIN: 1.95.0
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '692T845H5K' }}

jobs:
  windows-check:
    name: Windows build & test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER=$(grep '^version' crates/sleipnir/Cargo.toml | head -1 | awk '{print $3}' | tr -d '"')
          fi
          VER="${VER#v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test -p terminal -p sleipnir_ui -p sleipnir_settings -p updater -p sleipnir -p run_ledger -p sleipnir_ctl

      - name: Release build
        run: cargo build --release -p sleipnir

      - name: Package zip
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          mkdir -p build
          cp target/release/sleipnir.exe build/sleipnir.exe
          tar.exe -a -c -f "build/Sleipnir-${VER}-windows-x64.zip" -C build sleipnir.exe
          HASH=$(powershell.exe -NoProfile -Command \
            "(Get-FileHash -Algorithm SHA256 'build/Sleipnir-${VER}-windows-x64.zip').Hash.ToLower()")
          echo "${HASH}" > "build/Sleipnir-${VER}-windows-x64.zip.sha256"
          ls -lh "build/Sleipnir-${VER}-windows-x64.zip"
          echo "  sha256: ${HASH}"

      - name: Upload sleipnir.exe
        uses: actions/upload-artifact@v4
        with:
          name: sleipnir-windows
          path: |
            build/Sleipnir-*-windows-x64.zip
            build/Sleipnir-*-windows-x64.zip.sha256
            target/release/sleipnir.exe

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          TAG="v${VER}"
          ZIP="build/Sleipnir-${VER}-windows-x64.zip"
          SHA="build/Sleipnir-${VER}-windows-x64.zip.sha256"
          # macOS job creates the release; wait until it exists.
          for i in $(seq 1 36); do
            if gh release view "${TAG}" >/dev/null 2>&1; then
              gh release upload "${TAG}" "${ZIP}" "${SHA}" --clobber
              echo "Uploaded Windows assets to ${TAG}"
              exit 0
            fi
            echo "release ${TAG} not ready yet (${i}/36); sleeping"
            sleep 10
          done
          echo "ERROR: GitHub release ${TAG} did not appear in time" >&2
          exit 1

  build-and-release:
    name: Build & Publish
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HAS_SIGNING_CERT: ${{ secrets.CODE_SIGNING_CERT_P12 != '' }}
      HAS_NOTARIZATION: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Import signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-data: ${{ secrets.CODE_SIGNING_CERT_P12 }}
          p12-password: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER=$(grep '^version' crates/sleipnir/Cargo.toml | head -1 | awk '{print $3}' | tr -d '"')
          fi
          VER="${VER#v}"   # normalize: strip any leading 'v'
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release -p sleipnir

      - name: Assemble .app bundle
        run: |
          APP="Sleipnir.app"
          VER="${{ steps.version.outputs.version }}"
          rm -rf "${APP}" build
          mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources" build
          cp target/release/sleipnir "${APP}/Contents/MacOS/sleipnir"
          sed "s|0.1.0|${VER}|g" resources/Info.plist > "${APP}/Contents/Info.plist"
          cp resources/AppIcon.icns "${APP}/Contents/Resources/AppIcon.icns"
          cp resources/Sleipnir.sdef "${APP}/Contents/Resources/Sleipnir.sdef"
          echo "  app bundle: ${APP}"

      - name: Code sign
        run: |
          # Prefer developer cert if available, fall back to ad-hoc (unsigned distributable)
          if security find-identity -v -p codesigning | grep -q "Apple Development"; then
            IDENTITY=$(security find-identity -v -p codesigning \
              | grep "Apple Development" | head -1 \
              | awk -F'"' '{print $2}')
            echo "  signing with dev cert: ${IDENTITY}"
            codesign --sign "${IDENTITY}" \
              --entitlements resources/sleipnir.entitlements \
              --deep --force --options runtime \
              Sleipnir.app
            codesign --verify --deep --strict Sleipnir.app
          else
            echo "  no dev cert — applying ad-hoc sign (Gatekeeper will show warning)"
            codesign -s - --deep --force Sleipnir.app
            codesign --verify --deep Sleipnir.app
          fi
          echo "  signed: $(codesign -d --verbose=4 Sleipnir.app 2>&1 | head -3)"

      - name: Package .zip
        run: |
          VER="${{ steps.version.outputs.version }}"
          ditto -c -k --sequesterRsrc --keepParent Sleipnir.app \
            "build/Sleipnir-${VER}-macos.zip"
          du -sh "build/Sleipnir-${VER}-macos.zip"
          echo "zip=build/Sleipnir-${VER}-macos.zip" >> "$GITHUB_ENV"
          # SHA-256 sidecar for the auto-updater to verify downloads.
          ( cd build && shasum -a 256 "Sleipnir-${VER}-macos.zip" \
            | awk '{print $1}' > "Sleipnir-${VER}-macos.zip.sha256" )
          echo "  sha256: $(cat build/Sleipnir-${VER}-macos.zip.sha256)"
          echo "sha=build/Sleipnir-${VER}-macos.zip.sha256" >> "$GITHUB_ENV"

      - name: Gatekeeper bypass (ad-hoc signed apps)
        run: |
          # Remove quarantine attribute so macOS doesn't block the app on first launch
          xattr -cr Sleipnir.app
          echo "  quarantine cleared"
          spctl --assess --type execute --verbose=4 Sleipnir.app/Contents/MacOS/sleipnir 2>&1 \
            || echo "  (spctl: app not notarized — Gatekeeper will show warning on first run, right-click → Open to bypass)"

      - name: Package .dmg
        run: |
          VER="${{ steps.version.outputs.version }}"
          hdiutil create -volname "Sleipnir-${VER}" \
            -srcfolder build \
            -ov -format UDZO \
            "build/Sleipnir-${VER}-macos.dmg"
          du -sh "build/Sleipnir-${VER}-macos.dmg"
          echo "dmg=build/Sleipnir-${VER}-macos.dmg" >> "$GITHUB_ENV"

      - name: Notarize
        if: env.HAS_NOTARIZATION == 'true'
        run: |
          xcrun notarytool submit "${{ env.zip }}" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --team-id "${{ env.APPLE_TEAM_ID }}" \
            --wait
          xcrun stapler staple Sleipnir.app

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DRAFT: ${{ github.event.inputs.draft || 'false' }}
        run: |
          TAG="v${VERSION}"
          ZIP="build/Sleipnir-${VERSION}-macos.zip"
          SHA="build/Sleipnir-${VERSION}-macos.zip.sha256"
          DMG="build/Sleipnir-${VERSION}-macos.dmg"

          {
            echo "## Sleipnir v${VERSION}"
            echo ""
            echo "### Install"
            echo ""
            echo "**macOS:** Download \`Sleipnir-${VERSION}-macos.dmg\` (recommended) or \`Sleipnir-${VERSION}-macos.zip\`."
            echo "Open the .dmg and drag Sleipnir to Applications."
            echo ""
            echo "> **Note:** The macOS build is ad-hoc signed (no Apple Developer certificate in CI)."
            echo "> On first launch Gatekeeper will show \"Sleipnir is an unidentified developer\"."
            echo "> Right-click the app and choose **Open** to bypass."
            echo ""
            echo "**Windows:** Download \`Sleipnir-${VERSION}-windows-x64.zip\`, unzip, and run \`sleipnir.exe\`."
            echo "The Windows zip is attached by the Windows job a few minutes after this release is created."
            echo "In-place auto-update stays macOS-only; Check for Updates opens this page."
            echo ""
            echo "Linux is not supported."
            echo ""
            echo "### Requirements"
            echo "- macOS 14.0+ (Sonoma), or Windows 10 1809+ with a Direct3D 11 GPU"
            echo "- Rust 1.95+ (only needed for building from source)"
            echo ""
            echo "### Source"
            echo "https://github.com/Maidang1/sleipnir"
          } > release-notes.md

          DRAFT_FLAG=()
          if [[ "${DRAFT}" == "true" ]]; then
            DRAFT_FLAG=(--draft)
          fi

          gh release create "${TAG}" \
            --title "Sleipnir v${VERSION}" \
            --notes-file release-notes.md \
            "${DRAFT_FLAG[@]}" \
            "${ZIP}" \
            "${SHA}" \
            "${DMG}"

          echo "Published: $(gh release view "${TAG}" --json url --jq '.url')"
