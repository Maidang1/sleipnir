name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  APP_NAME: Sleipnir
  RUST_TOOLCHAIN: 1.95.0
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '692T845H5K' }}

jobs:
  windows-check:
    name: Windows build & test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Determine version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -n "${INPUT_VERSION}" ]]; then
            VER="${INPUT_VERSION}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="$(cargo metadata --no-deps --format-version 1 \
              | python -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "sleipnir"))')"
          fi
          VER="${VER#v}"
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${VER}" =~ ${SEMVER_RE} ]]; then
            echo "ERROR: invalid release version: ${VER}" >&2
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test -p terminal -p sleipnir_ui -p sleipnir_settings -p updater -p sleipnir-update-helper -p sleipnir -p run_ledger -p sleipnir_ctl

      - name: Release build
        run: cargo build --release -p sleipnir

      - name: Package exe
        shell: bash
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p build
          EXE="build/Sleipnir-${VER}-windows-x64.exe"
          cp target/release/sleipnir.exe "${EXE}"
          HASH=$(powershell.exe -NoProfile -Command \
            "(Get-FileHash -Algorithm SHA256 '${EXE}').Hash.ToLower()")
          echo "${HASH}" > "${EXE}.sha256"
          ls -lh "${EXE}"
          echo "  sha256: ${HASH}"

      - name: Upload sleipnir.exe
        uses: actions/upload-artifact@v4
        with:
          name: sleipnir-windows
          path: |
            build/Sleipnir-*-windows-x64.exe
            build/Sleipnir-*-windows-x64.exe.sha256

  linux-check:
    name: Linux ${{ matrix.artifact-suffix }} build, test & package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            expected-arch: x86_64
            expected-machine: Advanced Micro Devices X86-64
            deb-arch: amd64
            artifact-suffix: x86_64
          - runner: ubuntu-22.04-arm
            expected-arch: aarch64
            expected-machine: AArch64
            deb-arch: arm64
            artifact-suffix: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Assert native architecture
        run: test "$(uname -m)" = "${{ matrix.expected-arch }}"

      - name: Install Linux build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libfontconfig-dev \
            libfreetype-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libglib2.0-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            python3-pil \
            dpkg-dev \
            desktop-file-utils \
            libnotify-bin \
            xdg-utils \
            xvfb \
            xdotool \
            shellcheck

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Determine version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -n "${INPUT_VERSION}" ]]; then
            VER="${INPUT_VERSION}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="$(cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "sleipnir"))')"
          fi
          VER="${VER#v}"
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${VER}" =~ ${SEMVER_RE} ]]; then
            echo "ERROR: invalid release version: ${VER}" >&2
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"

      - name: Test workspace
        run: cargo test --workspace

      - name: Test packaging and installer scripts
        run: |
          bash scripts/tests/test-linux-package.sh
          bash scripts/tests/test-install.sh

      - name: Lint shell scripts
        run: shellcheck scripts/install.sh scripts/make-linux-package.sh scripts/tests/*.sh

      - name: Build release binary once
        run: cargo build --release -p sleipnir

      - name: Package existing native ELF
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          SLEIPNIR_VERSION="${VER}" ./scripts/make-linux-package.sh \
            --binary target/release/sleipnir \
            --out build
          test -f "build/Sleipnir-${VER}-linux-${{ matrix.artifact-suffix }}.tar.gz"
          test -f "build/sleipnir_${VER}_${{ matrix.deb-arch }}.deb"

      - name: Validate Linux release artifacts
        env:
          VER: ${{ steps.version.outputs.version }}
          EXPECTED_MACHINE: ${{ matrix.expected-machine }}
          DEB_ARCH: ${{ matrix.deb-arch }}
          PORTABLE_ARCH: ${{ matrix.artifact-suffix }}
        run: |
          TARBALL="Sleipnir-${VER}-linux-${PORTABLE_ARCH}.tar.gz"
          DEB="sleipnir_${VER}_${DEB_ARCH}.deb"

          readelf -h target/release/sleipnir | grep -F "${EXPECTED_MACHINE}"

          tar_contents="$(tar -tzf "build/${TARBALL}")"
          tar_root="Sleipnir-${VER}-linux-${PORTABLE_ARCH}"
          for path in \
            "${tar_root}/sleipnir" \
            "${tar_root}/sleipnir.desktop" \
            "${tar_root}/sleipnir.png" \
            "${tar_root}/README.txt" \
            "${tar_root}/LICENSE"; do
            grep -Fx "${path}" <<<"${tar_contents}"
          done

          test "$(dpkg-deb --field "build/${DEB}" Architecture)" = "${DEB_ARCH}"
          depends="$(dpkg-deb --field "build/${DEB}" Depends)"
          for package in \
            libx11-6 libxcb1 libxkbcommon0 libxkbcommon-x11-0 \
            libvulkan1 libwayland-client0 libfontconfig1 xdg-utils libnotify-bin; do
            grep -Eq "(^|, )${package}([ (]|,|$)" <<<"${depends}"
          done

          deb_contents="$(dpkg-deb --contents "build/${DEB}")"
          for path in \
            './usr/bin/sleipnir' \
            './usr/share/applications/sleipnir.desktop' \
            './usr/share/icons/hicolor/48x48/apps/sleipnir.png' \
            './usr/share/icons/hicolor/64x64/apps/sleipnir.png' \
            './usr/share/icons/hicolor/128x128/apps/sleipnir.png' \
            './usr/share/icons/hicolor/256x256/apps/sleipnir.png' \
            './usr/share/icons/hicolor/512x512/apps/sleipnir.png' \
            './usr/share/doc/sleipnir/README.txt' \
            './usr/share/doc/sleipnir/changelog.gz' \
            './usr/share/doc/sleipnir/copyright' \
            './usr/share/licenses/sleipnir/LICENSE'; do
            grep -F "${path}" <<<"${deb_contents}"
          done

          desktop-file-validate resources/linux/sleipnir.desktop
          for artifact in "build/${TARBALL}" "build/${DEB}"; do
            expected="$(tr -d '[:space:]' < "${artifact}.sha256")"
            [[ "${expected}" =~ ^[0-9a-f]{64}$ ]]
            actual="$(sha256sum "${artifact}" | awk '{print $1}')"
            test "${expected}" = "${actual}"
          done

      - name: Smoke X11 window creation
        run: |
          unset WAYLAND_DISPLAY
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s '-screen 0 1280x720x24' bash -euo pipefail <<'SH'
          target/release/sleipnir >sleipnir-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          found=0
          for _ in $(seq 1 40); do
            if xdotool search --onlyvisible --pid "$pid" >/dev/null 2>&1; then
              found=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat sleipnir-smoke.log >&2
              exit 1
            fi
            sleep 0.25
          done
          if [[ "${found}" != "1" ]]; then
            cat sleipnir-smoke.log >&2
            echo "ERROR: Sleipnir stayed alive but did not create a visible X11 window" >&2
            exit 1
          fi
          SH

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: sleipnir-linux-${{ matrix.artifact-suffix }}
          if-no-files-found: error
          path: |
            build/Sleipnir-${{ steps.version.outputs.version }}-linux-${{ matrix.artifact-suffix }}.tar.gz
            build/Sleipnir-${{ steps.version.outputs.version }}-linux-${{ matrix.artifact-suffix }}.tar.gz.sha256
            build/sleipnir_${{ steps.version.outputs.version }}_${{ matrix.deb-arch }}.deb
            build/sleipnir_${{ steps.version.outputs.version }}_${{ matrix.deb-arch }}.deb.sha256

  build-and-release:
    name: Build & Publish
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HAS_SIGNING_CERT: ${{ secrets.CODE_SIGNING_CERT_P12 != '' }}
      HAS_NOTARIZATION: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Import signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-data: ${{ secrets.CODE_SIGNING_CERT_P12 }}
          p12-password: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -n "${INPUT_VERSION}" ]]; then
            VER="${INPUT_VERSION}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="$(cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "sleipnir"))')"
          fi
          VER="${VER#v}"
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${VER}" =~ ${SEMVER_RE} ]]; then
            echo "ERROR: invalid release version: ${VER}" >&2
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        run: cargo build --release -p sleipnir -p sleipnir-update-helper

      - name: Assemble .app bundle
        run: |
          APP="Sleipnir.app"
          VER="${{ steps.version.outputs.version }}"
          rm -rf "${APP}" build
          mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources" build
          cp target/release/sleipnir "${APP}/Contents/MacOS/sleipnir"
          cp target/release/sleipnir-update-helper "${APP}/Contents/MacOS/sleipnir-update-helper"
          chmod 755 "${APP}/Contents/MacOS/sleipnir" "${APP}/Contents/MacOS/sleipnir-update-helper"
          file "${APP}/Contents/MacOS/sleipnir-update-helper"
          sed "s|0.1.0|${VER}|g" resources/Info.plist > "${APP}/Contents/Info.plist"
          cp resources/AppIcon.icns "${APP}/Contents/Resources/AppIcon.icns"
          cp resources/Sleipnir.sdef "${APP}/Contents/Resources/Sleipnir.sdef"
          cp resources/update-signing-public.pem "${APP}/Contents/Resources/update-signing-public.pem"
          echo "  app bundle: ${APP}"

      - name: Code sign
        run: |
          # Prefer developer cert if available, fall back to ad-hoc (unsigned distributable)
          if security find-identity -v -p codesigning | grep -q "Apple Development"; then
            IDENTITY=$(security find-identity -v -p codesigning \
              | grep "Apple Development" | head -1 \
              | awk -F'"' '{print $2}')
            echo "  signing with dev cert: ${IDENTITY}"
            codesign --sign "${IDENTITY}" \
              --entitlements resources/sleipnir.entitlements \
              --deep --force --options runtime \
              Sleipnir.app
            codesign --verify --deep --strict Sleipnir.app
          else
            echo "  no dev cert — applying ad-hoc sign (Gatekeeper will show warning)"
            codesign -s - --deep --force Sleipnir.app
            codesign --verify --deep Sleipnir.app
          fi
          echo "  signed: $(codesign -d --verbose=4 Sleipnir.app 2>&1 | head -3)"

      - name: Gatekeeper bypass (ad-hoc signed apps)
        run: |
          # Remove quarantine attribute so macOS doesn't block the app on first launch
          xattr -cr Sleipnir.app
          echo "  quarantine cleared"
          spctl --assess --type execute --verbose=4 Sleipnir.app/Contents/MacOS/sleipnir 2>&1 \
            || echo "  (spctl: app not notarized — Gatekeeper will show warning on first run, right-click → Open to bypass)"

      - name: Package .dmg
        run: |
          VER="${{ steps.version.outputs.version }}"
          # Stage only the .app so the disk image contains nothing else.
          rm -rf dmg-src
          mkdir -p dmg-src build
          cp -R Sleipnir.app dmg-src/Sleipnir.app
          hdiutil create -volname "Sleipnir-${VER}" \
            -srcfolder dmg-src \
            -ov -format UDZO \
            "build/Sleipnir-${VER}-macos.dmg"
          du -sh "build/Sleipnir-${VER}-macos.dmg"
          echo "dmg=build/Sleipnir-${VER}-macos.dmg" >> "$GITHUB_ENV"
          echo "sha=build/Sleipnir-${VER}-macos.dmg.sha256" >> "$GITHUB_ENV"

      - name: Notarize
        if: env.HAS_NOTARIZATION == 'true'
        run: |
          xcrun notarytool submit "${{ env.dmg }}" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --team-id "${{ env.APPLE_TEAM_ID }}" \
            --wait
          # Stapling rewrites the dmg, so the sha256 must be computed afterwards.
          xcrun stapler staple "${{ env.dmg }}"

      - name: Verify transactional updater
        run: scripts/test-macos-update.sh

      - name: SHA-256 sidecar and signed update manifest
        env:
          SLEIPNIR_UPDATE_SIGNING_KEY: ${{ secrets.SLEIPNIR_UPDATE_SIGNING_KEY }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          if [[ -z "${SLEIPNIR_UPDATE_SIGNING_KEY}" ]]; then
            echo "ERROR: SLEIPNIR_UPDATE_SIGNING_KEY is required for release publishing" >&2
            exit 1
          fi
          # Compute after any notarization/stapling so every verifier sees the
          # exact bytes uploaded to GitHub Releases.
          ( cd build && shasum -a 256 "Sleipnir-${VER}-macos.dmg" \
            | awk '{print $1}' > "Sleipnir-${VER}-macos.dmg.sha256" )
          scripts/sign-update-manifest.py \
            --version "${VER}" \
            --dmg "build/Sleipnir-${VER}-macos.dmg" \
            --output build/sleipnir-update-v1.json \
            --signature build/sleipnir-update-v1.json.sig \
            --public-key resources/update-signing-public.pem
          test -s build/sleipnir-update-v1.json.sig
          echo "  sha256: $(cat build/Sleipnir-${VER}-macos.dmg.sha256)"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          DMG="build/Sleipnir-${VERSION}-macos.dmg"
          SHA="build/Sleipnir-${VERSION}-macos.dmg.sha256"
          MANIFEST="build/sleipnir-update-v1.json"
          MANIFEST_SIGNATURE="build/sleipnir-update-v1.json.sig"
          test -s "${MANIFEST}" && test -s "${MANIFEST_SIGNATURE}"

          {
            echo "## Sleipnir v${VERSION}"
            echo ""
            echo "### Install"
            echo ""
            echo "**macOS:** Download \`Sleipnir-${VERSION}-macos.dmg\`, open it, and drag Sleipnir to Applications."
            echo ""
            echo "> **Note:** The macOS build is ad-hoc signed (no Apple Developer certificate in CI)."
            echo "> On first launch Gatekeeper will show \"Sleipnir is an unidentified developer\"."
            echo "> Right-click the app and choose **Open** to bypass."
            echo ""
            echo "**Windows:** Download \`Sleipnir-${VERSION}-windows-x64.exe\` and run it."
            echo "The Windows \`.exe\` is attached by the Windows job a few minutes after this release is created."
            echo "In-place auto-update stays macOS-only; Check for Updates opens this page."
            echo ""
            echo "**Linux x86_64:** Download \`sleipnir_${VERSION}_amd64.deb\` or \`Sleipnir-${VERSION}-linux-x86_64.tar.gz\`."
            echo "**Linux ARM64:** Download \`sleipnir_${VERSION}_arm64.deb\` or \`Sleipnir-${VERSION}-linux-aarch64.tar.gz\`."
            echo "Linux assets may appear after this release is created while the two native Linux jobs finish."
            echo "Ubuntu 22.04+ is supported with Vulkan on Wayland or X11. Other glibc 2.35+ desktop distributions are best effort."
            echo "In-place updates are macOS-only; Linux Check for Updates opens this release for manual installation."
            echo ""
            echo "### Requirements"
            echo "- macOS 14.0+ (Sonoma), Windows 10 1809+ with a Direct3D 11 GPU, or Ubuntu 22.04+ with Vulkan and Wayland/X11"
            echo "- Rust 1.95+ (only needed for building from source)"
            echo ""
            echo "### Source"
            echo "https://github.com/Maidang1/sleipnir"
          } > release-notes.md

          if gh release view "${TAG}" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "${TAG}" --json isDraft --jq '.isDraft')"
            if [[ "${IS_DRAFT}" != "true" ]]; then
              echo "ERROR: refusing to overwrite published release ${TAG}" >&2
              exit 1
            fi
            gh release edit "${TAG}" \
              --title "Sleipnir v${VERSION}" \
              --notes-file release-notes.md
            gh release upload "${TAG}" "${DMG}" "${SHA}" "${MANIFEST}" "${MANIFEST_SIGNATURE}" --clobber
          else
            gh release create "${TAG}" \
              --draft \
              --title "Sleipnir v${VERSION}" \
              --notes-file release-notes.md \
              "${DMG}" \
              "${SHA}" \
              "${MANIFEST}" \
              "${MANIFEST_SIGNATURE}"
          fi

          echo "Draft ready: $(gh release view "${TAG}" --json url --jq '.url')"

  release-assets-upload:
    name: Attach complete Windows and Linux release assets
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: [build-and-release, windows-check, linux-check]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Download Windows release artifact
        uses: actions/download-artifact@v4
        with:
          name: sleipnir-windows
          path: build/release

      - name: Download both Linux architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sleipnir-linux-*
          path: build/release
          merge-multiple: true

      - name: Upload exactly ten Windows and Linux release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -n "${INPUT_VERSION}" ]]; then
            VER="${INPUT_VERSION}"
          else
            VER="${GITHUB_REF#refs/tags/}"
          fi
          VER="${VER#v}"
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${VER}" =~ ${SEMVER_RE} ]]; then
            echo "ERROR: invalid release version: ${VER}" >&2
            exit 1
          fi
          TAG="v${VER}"
          assets=(
            "build/release/Sleipnir-${VER}-windows-x64.exe"
            "build/release/Sleipnir-${VER}-windows-x64.exe.sha256"
            "build/release/Sleipnir-${VER}-linux-x86_64.tar.gz"
            "build/release/Sleipnir-${VER}-linux-x86_64.tar.gz.sha256"
            "build/release/sleipnir_${VER}_amd64.deb"
            "build/release/sleipnir_${VER}_amd64.deb.sha256"
            "build/release/Sleipnir-${VER}-linux-aarch64.tar.gz"
            "build/release/Sleipnir-${VER}-linux-aarch64.tar.gz.sha256"
            "build/release/sleipnir_${VER}_arm64.deb"
            "build/release/sleipnir_${VER}_arm64.deb.sha256"
          )
          test "${#assets[@]}" -eq 10
          for asset in "${assets[@]}"; do
            test -f "${asset}"
          done
          IS_DRAFT="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')"
          if [[ "${IS_DRAFT}" != "true" ]]; then
            echo "ERROR: refusing to overwrite published release ${TAG}" >&2
            exit 1
          fi
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" "${assets[@]}" --clobber
          echo "Uploaded exactly ten Windows and Linux assets to draft ${TAG}"
