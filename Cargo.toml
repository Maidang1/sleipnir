[workspace]
resolver = "2"
members = [
    "crates/sleipnir",
    "crates/sleipnir_ui",
    "crates/sleipnir_settings",
    "crates/terminal",
    "crates/parse_bench",
    "crates/release_channel",
    "crates/updater",
    "crates/update_helper",
    "crates/run_ledger",
    "crates/diff_core",
    "crates/syntax",
    "crates/sleipnir_ctl",
    "crates/plugin_host",
    "crates/plugin_protocol",
    "crates/plugin_grants",
    "crates/sleipnir_plugin_sdk",
    "crates/sleipnir_plugin_failed_run",
    "crates/sleipnir_plugin_disk3d",
    "crates/sleipnir_widget",
    "crates/row_geometry",
    # OS-branched entry; gpui / gpui_macos / gpui_windows / gpui_linux come from Zed via git.
    "crates/gpui_platform",
]
default-members = ["crates/sleipnir"]

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]

# ---------------------------------------------------------------------------
# Zed monorepo pin (GPUI stack + shared utils). Bump `rev` to upgrade GPUI.
# Same commit is reused for every package below (one git clone).
# ---------------------------------------------------------------------------
# Pin recorded in UPSTREAM.md — keep in sync when changing rev.
# Zed: 371a7d4ba2fd0064b79a0bc67d28e57a906779dc (2026-08-09)

gpui = { git = "https://github.com/zed-industries/zed", rev = "371a7d4ba2fd0064b79a0bc67d28e57a906779dc", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui_macos = { git = "https://github.com/zed-industries/zed", rev = "371a7d4ba2fd0064b79a0bc67d28e57a906779dc", default-features = false, features = ["font-kit"] }
gpui_windows = { git = "https://github.com/zed-industries/zed", rev = "371a7d4ba2fd0064b79a0bc67d28e57a906779dc", default-features = false }
gpui_linux = { git = "https://github.com/zed-industries/zed", rev = "371a7d4ba2fd0064b79a0bc67d28e57a906779dc", default-features = false, features = ["wayland", "x11"] }
collections = { git = "https://github.com/zed-industries/zed", rev = "371a7d4ba2fd0064b79a0bc67d28e57a906779dc" }
util = { git = "https://github.com/zed-industries/zed", rev = "371a7d4ba2fd0064b79a0bc67d28e57a906779dc" }
util_macros = { git = "https://github.com/zed-industries/zed", rev = "371a7d4ba2fd0064b79a0bc67d28e57a906779dc" }

# ---------------------------------------------------------------------------
# sleipnir-local crates
# ---------------------------------------------------------------------------
sleipnir = { path = "crates/sleipnir" }
sleipnir_ui = { path = "crates/sleipnir_ui" }
sleipnir_settings = { path = "crates/sleipnir_settings" }
terminal = { path = "crates/terminal" }
release_channel = { path = "crates/release_channel" }
updater = { path = "crates/updater" }
run_ledger = { path = "crates/run_ledger" }
diff_core = { path = "crates/diff_core" }
syntax = { path = "crates/syntax" }
sleipnir_ctl = { path = "crates/sleipnir_ctl" }
plugin_host = { path = "crates/plugin_host" }
plugin_protocol = { path = "crates/plugin_protocol" }
plugin_grants = { path = "crates/plugin_grants" }
sleipnir-plugin = { path = "crates/sleipnir_plugin_sdk" }
sleipnir_widget = { path = "crates/sleipnir_widget" }
row_geometry = { path = "crates/row_geometry" }
gpui_platform = { path = "crates/gpui_platform", default-features = false, features = ["font-kit"] }

# ---------------------------------------------------------------------------
# External (only what local crates reference via workspace = true)
# ---------------------------------------------------------------------------
# Fork of zed-industries/alacritty @ 4c129667 + OSC 133/9/777 (ADR-0005).
alacritty_terminal = { git = "https://github.com/Maidang1/alacritty", rev = "561594caa275f00914a039356816fe70467a2d44" }
anyhow = "1.0.86"
base64 = "0.22"
flate2 = "1.1"
png = "0.17"
imara-diff = "0.1"
image = { version = "0.25.1", default-features = false, features = ["png"] }
smallvec = { version = "1.6", features = ["union", "const_new"] }
async-channel = "2.5.0"
dirs = "6.0"
env_logger = "0.11"
futures = "0.3.32"
futures-lite = "1.13"
itertools = "0.14.0"
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
memmap2 = "0.9"
parking_lot = "0.12.1"
percent-encoding = "2.3.2"
rand = "0.9"
regex = "1.5"
schemars = { version = "1.0", features = ["indexmap2"] }
semver = { version = "1.0", features = ["serde"] }
sha2 = "0.10"
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
sysinfo = "0.37.0"
tempfile = "3"
thiserror = "2.0.12"
url = "2.2"
urlencoding = "2.1.2"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4", "serde"] }
vte = { version = "0.15.0", features = ["ansi"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[profile.dev]
split-debuginfo = "unpacked"
codegen-units = 16

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1

# Zed util/smol needs these forks (same as upstream Zed workspace).
# `vte` is pinned to our fork so Handler::osc_custom reaches OSC 133/9/777 (ADR-0005).
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
vte = { git = "https://github.com/Maidang1/vte", rev = "94ce0d5fb89392da3b1b243b43e401068fb54937" }
