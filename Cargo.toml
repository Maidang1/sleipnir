[workspace]
resolver = "2"
members = [
    "crates/jiajia_term_ui",
    "crates/task_types",
    "crates/release_channel",
    "crates/jiajia_settings",
    "crates/terminal",
    "crates/http_client_tls",
    "crates/gpui_wgpu",
    "crates/gpui_web",
    "crates/collections",
    "crates/gpui",
    "crates/gpui_macos",
    "crates/gpui_macros",
    "crates/gpui_platform",
    "crates/gpui_shared_string",
    "crates/gpui_util",
    "crates/http_client",
    "crates/jiajia_term",
    "crates/media",
    "crates/path",
    "crates/perf",
    "crates/refineable",
    "crates/refineable/derive_refineable",
    "crates/scheduler",
    "crates/sum_tree",
    "crates/util",
    "crates/util_macros",
    "crates/zlog",
    "crates/ztracing",
    "crates/ztracing_macro",
]
default-members = ["crates/jiajia_term"]

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]

# path

terminal = { path = "crates/terminal" }
jiajia_settings = { path = "crates/jiajia_settings" }
release_channel = { path = "crates/release_channel" }
task_types = { path = "crates/task_types" }
jiajia_term_ui = { path = "crates/jiajia_term_ui" }
collections = { path = "crates/collections", version = "0.1.0" }
derive_refineable = { path = "crates/refineable/derive_refineable" }
# font-kit is required on macOS; without it gpui_macos uses NoopTextSystem (blank text).
gpui = { path = "crates/gpui", default-features = false, features = ["font-kit"] }
gpui_macos = { path = "crates/gpui_macos", default-features = false, features = ["font-kit"] }
gpui_macros = { path = "crates/gpui_macros" }
gpui_platform = { path = "crates/gpui_platform", default-features = false, features = ["font-kit"] }
gpui_shared_string = { path = "crates/gpui_shared_string" }
gpui_util = { path = "crates/gpui_util" }
http_client = { path = "crates/http_client" }
media = { path = "crates/media" }
path = { path = "crates/path" }
perf = { path = "crates/perf" }
refineable = { path = "crates/refineable" }
scheduler = { path = "crates/scheduler" }
sum_tree = { path = "crates/sum_tree" }
util = { path = "crates/util" }
util_macros = { path = "crates/util_macros" }
zlog = { path = "crates/zlog" }
ztracing = { path = "crates/ztracing" }
ztracing_macro = { path = "crates/ztracing_macro" }
jiajia_term = { path = "crates/jiajia_term" }

