[workspace]
resolver = "2"
members = [
    "crates/harbor",
    "crates/harbor_ui",
    "crates/harbor_settings",
    "crates/terminal",
    "crates/task_types",
    "crates/release_channel",
    # Slim macOS-only entry; underlying gpui/gpui_macos come from Zed via git.
    "crates/gpui_platform",
]
default-members = ["crates/harbor"]

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]

# ---------------------------------------------------------------------------
# Zed monorepo pin (GPUI stack + shared utils). Bump `rev` to upgrade GPUI.
# Same commit is reused for every package below (one git clone).
# ---------------------------------------------------------------------------
# Pin recorded in UPSTREAM.md — keep in sync when changing rev.
# Zed: 371a7d4ba2fd0064b79a0bc67d28e57a906779dc (2026-08-09)

gpui = { git = "https://github.com/zed-industries/zed", rev = "371a7d4ba2fd0064b79a0bc67d28e57a906779dc", default-features = false, features = ["font-kit"] }
gpui_macos = { git = "https://github.com/zed-industries/zed", rev = "371a7d4ba2fd0064b79a0bc67d28e57a906779dc", default-features = false, features = ["font-kit"] }
collections = { git = "https://github.com/zed-industries/zed", rev = "371a7d4ba2fd0064b79a0bc67d28e57a906779dc" }
util = { git = "https://github.com/zed-industries/zed", rev = "371a7d4ba2fd0064b79a0bc67d28e57a906779dc" }
util_macros = { git = "https://github.com/zed-industries/zed", rev = "371a7d4ba2fd0064b79a0bc67d28e57a906779dc" }

# ---------------------------------------------------------------------------
# harbor-local crates
# ---------------------------------------------------------------------------
harbor = { path = "crates/harbor" }
harbor_ui = { path = "crates/harbor_ui" }
harbor_settings = { path = "crates/harbor_settings" }
terminal = { path = "crates/terminal" }
task_types = { path = "crates/task_types" }
release_channel = { path = "crates/release_channel" }
gpui_platform = { path = "crates/gpui_platform", default-features = false, features = ["font-kit"] }

# ---------------------------------------------------------------------------
# External (only what local crates reference via workspace = true)
# ---------------------------------------------------------------------------
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f" }
anyhow = "1.0.86"
async-channel = "2.5.0"
dirs = "6.0"
env_logger = "0.11"
futures = "0.3.32"
futures-lite = "1.13"
itertools = "0.14.0"
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
parking_lot = "0.12.1"
percent-encoding = "2.3.2"
rand = "0.9"
regex = "1.5"
schemars = { version = "1.0", features = ["indexmap2"] }
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
sysinfo = "0.37.0"
thiserror = "2.0.12"
url = "2.2"
urlencoding = "2.1.2"
vte = { version = "0.15.0", features = ["ansi"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[profile.dev]
split-debuginfo = "unpacked"
codegen-units = 16

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1

# Zed util/smol needs these forks (same as upstream Zed workspace).
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
